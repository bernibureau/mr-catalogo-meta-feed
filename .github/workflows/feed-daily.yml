# Regenera el feed del catálogo MR una vez por día y lo commitea a docs/feed.csv.
# Commerce Manager lo consume por URL raw de GitHub.
name: feed-daily
on:
  schedule: [{ cron: "0 6 * * *" }]   # diario 06:00 UTC (03:00 AR)
  workflow_dispatch: {}
permissions: { contents: write }
concurrency: { group: feed, cancel-in-progress: false }
jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scraper.js
      - run: |
          git config user.name "deepbeacon-bot"
          git config user.email "noreply@bureaucreativo.com"
          git add docs/feed.csv docs/products.json
          git commit -m "feed: refresh $(date -u +%F)" || { echo "sin cambios"; exit 0; }
          git pull --rebase --autostash || true
          git push
